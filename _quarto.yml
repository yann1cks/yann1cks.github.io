project:
  type: website
  output-dir: _site
  resources:
    - assets/fonts/**

website:
  title: "Yannick Stadtfeld"
  description: "Notes on marketing data science, measurement, and reproducible analysis, with occasional writing about my homelab and other things."
  search: false
  favicon: assets/favicon.svg
  open-graph: true
  twitter-card:
    card-style: summary
  navbar:
    pinned: true
    collapse-below: md
    tools-collapse: true
    right:
      - text: Blog
        href: blog.qmd
      - text: Projects
        href: projects.qmd
      - text: About
        href: cv.qmd
  page-footer:
    left: "Yannick Stadtfeld · Notes on marketing data science"
    right:
      - text: GitHub
        href: https://github.com/yann1cks
      - text: LinkedIn
        href: https://www.linkedin.com/in/yannick-stadtfeld/

format:
  html:
    theme:
      light:
        - cosmo
        - styles/typography.scss
        - styles/theme.scss
      dark:
        - cosmo
        - styles/typography.scss
        - styles/theme-dark.scss
    css: styles/styles.css
    include-after-body: styles/navigation.html
    grid:
      body-width: 672px
    toc: false
    code-copy: true
    code-line-numbers: true
    syntax-highlighting: arrow
    lang: en
    respect-user-color-scheme: true
    section-divs: true

execute:
  freeze: auto
  warning: false
  message: false
